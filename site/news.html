<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News &middot; Glenridge Homeowners Association</title>
  <meta name="description" content="Announcements and updates from the board of the Glenridge Homeowners Association in Clearcreek Township, Ohio.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <script type="module" src="assets/js/pages/news.js"></script>
</head>
<body class="bg-paper font-body text-lg leading-[1.55] text-ink">

<noscript>
  <p>This site needs JavaScript to display. For help, or for anything you cannot find here, email the board at <a href="mailto:glenridgehomeowners@gmail.com">glenridgehomeowners@gmail.com</a>.</p>
</noscript>

<site-header current="news"></site-header>

<main id="main" class="scroll-mt-6">

  <!-- TITLE Band -->
  <section class="bg-steel-800 text-white">
    <div class="mx-auto max-w-[1280px] px-6 py-12 md:px-10 md:py-16">
      <p class="m-0 mb-3 text-sm font-medium uppercase tracking-[0.12em] text-steel-300">Updates from the board</p>
      <h1 class="m-0 font-heading text-5xl font-semibold leading-none text-white md:text-6xl">News</h1>
    </div>
  </section>

  <!-- NEWS Band -->
  <section class="bg-white">
    <div class="mx-auto grid max-w-[1280px] grid-cols-1 gap-12 px-6 py-12 md:px-10 md:py-16 lg:grid-cols-[1fr_320px]">

      <!--
        The news Content fills this column: the topic filter, the list of items
        and the count. It also carries the "couldn't be loaded" message, so a
        broken news.json leaves the rest of the page standing. Its minimum
        height reserves the space, so nothing shifts when the Content arrives.
      -->
      <div id="news" class="min-h-[32rem]">
        <div id="news-filters" class="mb-8 flex flex-wrap gap-2" role="group" aria-label="Filter by topic" hidden></div>
        <ul id="news-list" class="m-0 flex list-none flex-col gap-4 p-0"></ul>
        <p id="news-count" class="m-0 mt-6 text-neutral-700" aria-live="polite"></p>
      </div>

      <aside class="grid content-start gap-4" aria-label="Portal and meetings">
        <a id="news-pay" class="block bg-steel-700 p-6 text-white no-underline hover:bg-steel-800" target="_blank" rel="noopener" hidden>
          <span class="block font-heading text-2xl font-semibold leading-tight">Pay dues</span>
          <span class="mt-1 block text-steel-100">Opens the payment portal<span class="sr-only"> (opens in a new tab)</span></span>
        </a>
        <a id="news-request" class="block bg-steel-900 p-6 text-white no-underline hover:bg-steel-800" target="_blank" rel="noopener" hidden>
          <span class="block font-heading text-2xl font-semibold leading-tight">Submit a request</span>
          <span class="mt-1 block text-steel-200">Maintenance, violations, questions<span class="sr-only"> (opens in a new tab)</span></span>
        </a>
        <!-- The second line names the next meeting once meetings.json has been
             read, and otherwise stays as written. -->
        <a href="meetings.html" class="block border-l-8 border-steel-700 bg-paper p-6 text-ink no-underline hover:bg-steel-100">
          <span class="block font-heading text-2xl font-semibold leading-tight">Board meetings</span>
          <span id="news-next-meeting" class="mt-1 block text-neutral-800">Dates, agendas and minutes</span>
        </a>
      </aside>

    </div>
  </section>

</main>

<site-footer></site-footer>

<!-- One news item. The page module clones this and fills it with text. -->
<template id="news-item-template">
  <li class="grid grid-cols-1 border border-ink/10 bg-paper sm:grid-cols-[140px_1fr]">
    <div class="bg-steel-100 p-4 leading-tight text-steel-800">
      <time data-date class="block font-heading text-xl font-semibold"></time>
      <span data-tag class="mt-2 block text-sm font-medium uppercase tracking-[0.1em] text-steel-700"></span>
    </div>
    <article class="p-5">
      <h2 data-title class="m-0 mb-1.5 font-heading text-2xl font-semibold leading-tight"></h2>
      <p data-summary class="m-0 text-neutral-800"></p>
      <div data-body class="mt-3 grid gap-3"></div>
    </article>
  </li>
</template>

<!-- One paragraph of a news item's body. -->
<template id="news-paragraph-template">
  <p class="m-0 text-neutral-800"></p>
</template>

<!-- One topic in the filter, including the "All" button. -->
<template id="news-filter-template">
  <button type="button" class="min-h-12 cursor-pointer border-2 border-steel-700 bg-transparent px-4 font-heading text-lg font-semibold text-steel-800 hover:bg-steel-100 aria-pressed:bg-steel-700 aria-pressed:text-white"></button>
</template>

</body>
</html>
